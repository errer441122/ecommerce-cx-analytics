name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Le regole: 48 casi sporchi e gli altri controlli"
        run: node --test tests/regole.test.mjs

      - name: "Il workflow n8n contiene le stesse regole"
        run: |
          node workflows/costruisci.mjs
          git diff --exit-code -- workflows

      - name: "La prova: perché una nota di credito da sola non ferma"
        run: |
          python prove/nota_di_credito.py > /dev/null
          git diff --exit-code -- prove

      - name: "L'analisi del CV: dati e tabelle"
        working-directory: analisi-cv
        run: |
          for f in olist_reviews.csv olist_review_comments.csv; do
            expected=$(grep -F "$f:" data/REAL_DATA_PROVENANCE.md | grep -oE '[0-9a-f]{64}')
            test "$expected" = "$(sha256sum "data/$f" | cut -d' ' -f1)"
          done
          python src/validate_cx_data.py
          python src/build_cx_summary.py
          python src/cx_driver_analysis.py
          git diff --exit-code -- reports
          python -m unittest discover -s tests

      - name: Cross-check notebook (pandas, statsmodels)
        working-directory: analisi-cv
        run: |
          python -m pip install -r requirements-notebook.txt
          python -c "import nbformat, nbclient; nb = nbformat.read('notebooks/cross_check.ipynb', as_version=4); nbclient.NotebookClient(nb, timeout=900, kernel_name='python3', resources={'metadata': {'path': 'notebooks'}}).execute()"
